<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Настольный органайзер для ручек и карточек">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecf0e6"/>
      <stop offset="1" stop-color="#d9e4d3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e9ddc8"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3d6c1"/>
      <stop offset=".5" stop-color="#f8efdf"/>
      <stop offset="1" stop-color="#ddcfb9"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#53634c" flood-opacity=".18"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M230 300H570L586 470Q588 492 566 492H234Q212 492 214 470Z"/>
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#71806a" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="655" cy="120" r="172" fill="#dfe9d9" opacity=".9"/>
  <path d="M146 600V328a254 254 0 0 1 508 0v272Z" fill="#e7ede1" opacity=".85"/>
  <rect x="70" y="82" width="150" height="110" fill="url(#dots)" opacity=".6"/>
  <ellipse cx="400" cy="514" rx="208" ry="27" fill="#526148" opacity=".18" filter="url(#blur)"/>

  <!-- Ручки и линейка, выглядывающие из органайзера -->
  <g filter="url(#shadow)">
    <rect x="278" y="150" width="18" height="190" rx="9" fill="#2b2e36"/>
    <path d="M278 150h18l-9-22Z" fill="#2b2e36"/>
    <rect x="278" y="214" width="18" height="12" fill="#e2f36c"/>
    <rect x="318" y="128" width="20" height="208" rx="10" fill="#e07151"/>
    <path d="M318 128h20l-10-24Z" fill="#a44b32"/>
    <rect x="318" y="188" width="20" height="9" fill="#fff4e4"/>
    <rect x="397" y="142" width="18" height="196" rx="9" fill="#d6dd9a"/>
    <path d="M397 142h18l-9-20Z" fill="#8a8f52"/>
    <rect x="488" y="118" width="26" height="220" rx="6" fill="#b7c7a7"/>
    <g stroke="#7d8f70" stroke-width="1.6" opacity=".7">
      <path d="M494 144h14M494 160h14M494 176h14M494 192h14M494 208h14M494 224h14M494 240h14M494 256h14M494 272h14M494 288h14"/>
    </g>
    <rect x="532" y="168" width="16" height="174" rx="8" fill="#d8b98b"/>
    <path d="M532 168h16l-8-20Z" fill="#34343a"/>
  </g>

  <!-- Корпус -->
  <path d="M230 300H570L586 470Q588 492 566 492H234Q212 492 214 470Z" fill="url(#body)"/>
  <path d="M230 300Q400 278 570 300L566 324Q400 304 234 324Z" fill="url(#top)"/>

  <g clip-path="url(#bodyClip)" stroke="#cbbba2" stroke-opacity=".32" stroke-width="1.6" fill="none">
    <path d="M210 344Q400 362 590 344"/>
    <path d="M210 368Q400 386 590 368"/>
    <path d="M210 392Q400 410 590 392"/>
    <path d="M210 416Q400 434 590 416"/>
    <path d="M210 440Q400 458 590 440"/>
    <path d="M210 464Q400 482 590 464"/>
  </g>

  <!-- Отверстия -->
  <g fill="#a99a83">
    <path d="M248 302Q276 294 304 302L302 322Q276 314 250 322Z"/>
    <path d="M328 300Q356 292 384 300L382 322Q356 314 330 320Z"/>
    <path d="M408 300Q436 292 464 300L462 322Q436 314 410 320Z"/>
    <path d="M492 300Q520 294 548 302L546 322Q520 316 494 320Z"/>
  </g>

  <!-- Дно и акценты -->
  <path d="M214 470Q400 492 586 470" fill="none" stroke="#cdbda4" stroke-width="2"/>
  <rect x="274" y="470" width="44" height="14" rx="7" fill="#c5b49a"/>
  <rect x="482" y="470" width="44" height="14" rx="7" fill="#c5b49a"/>
  <path d="M218 470Q220 481 232 485" fill="none" stroke="#a89376" stroke-width="2" opacity=".5"/>

  <!-- Отделение для карточек -->
  <rect x="424" y="398" width="132" height="42" rx="12" fill="#d8cab4"/>
  <rect x="434" y="374" width="62" height="40" rx="5" fill="#f8f0df" transform="rotate(-4 465 394)"/>
  <rect x="474" y="380" width="64" height="36" rx="5" fill="#e2f36c" transform="rotate(5 506 398)"/>
  <path d="M442 390h38M484 396h36" stroke="#b3a78f" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <!-- Блик -->
  <path d="M236 326Q230 400 224 458" stroke="#fffdf7" stroke-opacity=".55" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Настенный держатель для ключей с двумя крючками">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7eae3"/>
      <stop offset="1" stop-color="#eed4c8"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f0e3cf"/>
    </linearGradient>
    <linearGradient id="hook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9a196"/>
      <stop offset="1" stop-color="#756f66"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7d5545" flood-opacity=".2"/>
    </filter>
    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#a27664" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="112" r="180" fill="#f4ded3" opacity=".9"/>
  <path d="M146 600V328a254 254 0 0 1 508 0v272Z" fill="#f3ddd1" opacity=".65"/>
  <rect x="70" y="388" width="152" height="120" fill="url(#dots)" opacity=".55"/>

  <ellipse cx="400" cy="498" rx="196" ry="24" fill="#875846" opacity=".16" filter="url(#blur)"/>

  <!-- Плашка -->
  <g filter="url(#soft)">
    <rect x="230" y="206" width="340" height="132" rx="30" fill="url(#plate)"/>
  </g>
  <rect x="242" y="218" width="316" height="108" rx="23" fill="none" stroke="#e2d3be" stroke-width="1.6"/>
  <circle cx="274" cy="238" r="5" fill="#d8c7b0"/>
  <circle cx="526" cy="238" r="5" fill="#d8c7b0"/>

  <!-- Лоток сверху -->
  <rect x="264" y="180" width="272" height="38" rx="16" fill="#f4e5cf"/>
  <rect x="274" y="188" width="252" height="10" rx="5" fill="#e9d7bc" opacity=".7"/>
  <circle cx="367" cy="188" r="14" fill="#d9ad63"/>
  <circle cx="367" cy="188" r="10" fill="#e7c17c"/>
  <rect x="414" y="174" width="62" height="26" rx="5" fill="#fffaf0" transform="rotate(-7 445 187)"/>
  <path d="M424 183h38" stroke="#cbb9a1" stroke-width="2" stroke-linecap="round"/>

  <!-- Крючки -->
  <g fill="none" stroke="url(#hook)" stroke-width="10" stroke-linecap="round">
    <path d="M320 332v28c0 20 14 30 32 30"/>
    <path d="M480 332v28c0 20-14 30-32 30"/>
  </g>
  <circle cx="320" cy="334" r="8" fill="#8f887e"/>
  <circle cx="480" cy="334" r="8" fill="#8f887e"/>

  <!-- Ключи -->
  <g transform="rotate(12 338 394)" filter="url(#soft)">
    <circle cx="338" cy="374" r="20" fill="none" stroke="#2b2e36" stroke-width="8"/>
    <rect x="331" y="392" width="14" height="78" rx="7" fill="#2b2e36"/>
    <rect x="345" y="436" width="21" height="10" rx="3" fill="#2b2e36"/>
    <rect x="345" y="452" width="15" height="10" rx="3" fill="#2b2e36"/>
  </g>
  <g transform="rotate(-13 470 398)" filter="url(#soft)">
    <circle cx="470" cy="378" r="18" fill="none" stroke="#c77b5b" stroke-width="7"/>
    <rect x="464" y="394" width="12" height="68" rx="6" fill="#c77b5b"/>
    <rect x="476" y="432" width="18" height="9" rx="3" fill="#c77b5b"/>
    <rect x="476" y="446" width="12" height="9" rx="3" fill="#c77b5b"/>
  </g>

  <!-- Маленькие акценты -->
  <path d="M296 348c-6 10-12 12-20 12M504 348c6 10 12 12 20 12" fill="none" stroke="#d2a48f" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <g fill="#c77b5b">
    <circle cx="286" cy="404" r="3" opacity=".7"/>
    <circle cx="528" cy="380" r="2.5" opacity=".6"/>
  </g>
</svg>

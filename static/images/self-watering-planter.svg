<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Кашпо с автополивом и суккулентом">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8eeda"/>
      <stop offset="1" stop-color="#ecd7b7"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#df9c7b"/>
      <stop offset=".55" stop-color="#c97858"/>
      <stop offset="1" stop-color="#a94f37"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fae80"/>
      <stop offset="1" stop-color="#5f7f58"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7cba4"/>
      <stop offset="1" stop-color="#82a072"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bcdc6"/>
      <stop offset="1" stop-color="#6fb1aa"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#7c513c" flood-opacity=".22"/>
    </filter>
    <clipPath id="potClip">
      <path d="M306 300H494L482 496Q480 514 462 514H338Q320 514 318 496Z"/>
    </clipPath>
    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#a47d5c" opacity=".32"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="646" cy="120" r="176" fill="#f4e2c6" opacity=".9"/>
  <path d="M146 600V330a254 254 0 0 1 508 0v270Z" fill="#f2dfc1" opacity=".7"/>
  <rect x="66" y="78" width="152" height="112" fill="url(#dots)" opacity=".55"/>

  <ellipse cx="400" cy="519" rx="142" ry="23" fill="#7c513c" opacity=".2" filter="url(#blur)"/>

  <!-- Растение -->
  <g transform="translate(400 296)">
    <g fill="url(#leafDark)">
      <path d="M0 0C-23-14-30-48-12-76 14-58 22-26 0 0Z" transform="rotate(-72)"/>
      <path d="M0 0C-23-14-30-48-12-76 14-58 22-26 0 0Z" transform="rotate(-44)"/>
      <path d="M0 0C-23-14-30-48-12-76 14-58 22-26 0 0Z" transform="rotate(-16)"/>
      <path d="M0 0C-23-14-30-48-12-76 14-58 22-26 0 0Z" transform="rotate(12)"/>
      <path d="M0 0C-23-14-30-48-12-76 14-58 22-26 0 0Z" transform="rotate(40)"/>
      <path d="M0 0C-23-14-30-48-12-76 14-58 22-26 0 0Z" transform="rotate(68)"/>
    </g>
    <g fill="url(#leafLight)">
      <path d="M0 0C-18-10-23-34-9-54 11-40 17-18 0 0Z" transform="rotate(-55) scale(.78)"/>
      <path d="M0 0C-18-10-23-34-9-54 11-40 17-18 0 0Z" transform="rotate(-20) scale(.78)"/>
      <path d="M0 0C-18-10-23-34-9-54 11-40 17-18 0 0Z" transform="rotate(15) scale(.78)"/>
      <path d="M0 0C-18-10-23-34-9-54 11-40 17-18 0 0Z" transform="rotate(50) scale(.78)"/>
    </g>
    <circle cx="0" cy="-3" r="10" fill="#6d8b62"/>
    <circle cx="-5" cy="-7" r="3" fill="#c9d9b6" opacity=".7"/>
  </g>

  <!-- Горшок -->
  <ellipse cx="400" cy="300" rx="104" ry="28" fill="#e2a184"/>
  <ellipse cx="400" cy="300" rx="88" ry="20" fill="#6d4435"/>
  <g fill="#4e352c" opacity=".65">
    <circle cx="372" cy="298" r="3"/>
    <circle cx="424" cy="294" r="2.5"/>
    <circle cx="399" cy="304" r="2"/>
    <circle cx="444" cy="302" r="2"/>
  </g>

  <g filter="url(#soft)">
    <path d="M306 300H494L482 496Q480 514 462 514H338Q320 514 318 496Z" fill="url(#pot)"/>
  </g>

  <g clip-path="url(#potClip)" fill="none">
    <g stroke="#f0b395" stroke-opacity=".34" stroke-width="5">
      <path d="M302 340Q400 362 498 340"/>
      <path d="M306 386Q400 408 494 386"/>
      <path d="M312 432Q400 454 488 432"/>
      <path d="M316 478Q400 500 484 478"/>
    </g>
    <g stroke="#97442f" stroke-opacity=".2" stroke-width="2.5">
      <path d="M304 362Q400 384 496 362"/>
      <path d="M308 408Q400 430 492 408"/>
      <path d="M314 454Q400 476 486 454"/>
    </g>
    <path d="M330 318C324 372 322 430 328 490" stroke="#ffd3b9" stroke-opacity=".28" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Окошко уровня воды -->
  <rect x="362" y="382" width="76" height="80" rx="19" fill="#e3f0ec" stroke="#b9d5cf" stroke-width="2"/>
  <path d="M368 431c9-7 17 7 26 0s17-7 26 0 12 4 12 4v20c0 7-6 3-12 3H368c-6 0-6 4-6-3Z" fill="url(#water)"/>
  <path d="M366 444c10-6 18 5 27 0s16-6 25 0 12 4 14 2" fill="none" stroke="#c6e6df" stroke-width="2.5" opacity=".8"/>
  <circle cx="382" cy="459" r="3" fill="#d4ece6" opacity=".7"/>
  <circle cx="414" cy="465" r="2" fill="#d4ece6" opacity=".6"/>
  <path d="M454 330c8 8 8 16 0 24" fill="none" stroke="#d4ece6" stroke-width="4" opacity=".6"/>

  <!-- Капли -->
  <g fill="#8fc6c0">
    <path d="M538 352c0 8-6 13-13 13s-13-5-13-13 13-22 13-22 13 14 13 22Z" opacity=".8"/>
    <circle cx="558" cy="402" r="5" opacity=".55"/>
    <circle cx="518" cy="438" r="3.5" opacity=".45"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Складная подставка для телефона">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f1f5"/>
      <stop offset="1" stop-color="#d3e5eb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e5c54"/>
      <stop offset=".6" stop-color="#1b8778"/>
      <stop offset="1" stop-color="#4cae9c"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e4d7c1"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#3f5a62" flood-opacity=".23"/>
    </filter>
    <pattern id="dots" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#72929b" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="114" r="176" fill="#e1eef2" opacity=".95"/>
  <path d="M146 600V330a254 254 0 0 1 508 0v270Z" fill="#e7f2f5" opacity=".7"/>
  <rect x="62" y="82" width="158" height="114" fill="url(#dots)" opacity=".55"/>
  <ellipse cx="400" cy="514" rx="184" ry="25" fill="#3f5a62" opacity=".19" filter="url(#blur)"/>

  <!-- Задняя опора -->
  <g filter="url(#soft)">
    <path d="M512 310 566 310 560 464 518 464Z" fill="#e8dcc7"/>
    <path d="M520 320 552 320 548 456 526 456Z" fill="#d9cbb3" opacity=".8"/>
  </g>

  <!-- Телефон -->
  <g transform="rotate(-8 410 300)" filter="url(#soft)">
    <rect x="318" y="108" width="184" height="334" rx="30" fill="#20242b"/>
    <rect x="329" y="119" width="162" height="312" rx="21" fill="url(#screen)"/>
    <path d="M329 370c22-26 40-14 57-38 17-23 31-38 52-16 17 18 31 26 53 12v83c0 11-9 20-20 20H349c-11 0-20-9-20-20Z" fill="#0d4e47" opacity=".55"/>
    <circle cx="462" cy="196" r="31" fill="#ff8a63" opacity=".9"/>
    <circle cx="452" cy="186" r="20" fill="#ffb095" opacity=".8"/>
    <path d="M350 156h44M350 170h28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".42"/>
    <rect x="401" y="128" width="58" height="10" rx="5" fill="#101318"/>
    <rect x="414" y="408" width="76" height="7" rx="3.5" fill="#ffffff" opacity=".62"/>
    <path d="M492 142v44" stroke="#3b404a" stroke-width="4" stroke-linecap="round"/>
    <path d="M333 150c-4 44-4 144 2 210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".13"/>
  </g>

  <!-- Нижняя опора -->
  <g filter="url(#soft)">
    <path d="M276 444c82 24 166 24 248 0l4 34c-84 24-172 24-256 0Z" fill="url(#stand)"/>
  </g>
  <path d="M284 452c80 22 154 22 234 0" fill="none" stroke="#fffdf6" stroke-width="3" opacity=".7"/>
  <path d="M290 480c74 18 148 18 222 0" fill="none" stroke="#b7a98f" stroke-width="2" opacity=".55"/>

  <!-- Кабель -->
  <path d="M506 452c20 14 30 32 26 54" fill="none" stroke="#20242b" stroke-width="4" stroke-linecap="round"/>
  <path d="M526 504c-2 10 3 18 12 21" fill="none" stroke="#20242b" stroke-width="5" stroke-linecap="round"/>

  <g fill="#7bb8b0">
    <circle cx="264" cy="352" r="3.5" opacity=".75"/>
    <circle cx="566" cy="400" r="2.5" opacity=".6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Разборная походная сушилка для посуды">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3ecdf"/>
      <stop offset="1" stop-color="#c8d8c4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5e6"/>
      <stop offset="1" stop-color="#e4d8c0"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e98161"/>
      <stop offset="1" stop-color="#bd5138"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#40523a" flood-opacity=".2"/>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#6d7d64" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="656" cy="118" r="118" fill="#f6eecb" opacity=".95"/>
  <path d="M0 494C120 450 226 474 340 496C470 522 620 486 800 438V600H0Z" fill="#bfd2ba"/>
  <path d="M0 540C146 500 268 528 400 548C540 568 668 540 800 510V600H0Z" fill="#aec4a8"/>
  <path d="M142 600V332a258 258 0 0 1 516 0v268Z" fill="#d9e5d4" opacity=".5"/>
  <rect x="64" y="80" width="156" height="112" fill="url(#dots)" opacity=".55"/>

  <ellipse cx="400" cy="508" rx="190" ry="25" fill="#3f5139" opacity=".18" filter="url(#blur)"/>

  <!-- Задние ножки -->
  <g stroke="#ded2ba" stroke-width="12" stroke-linecap="round">
    <path d="M344 318 330 454"/>
    <path d="M456 318 470 454"/>
  </g>

  <!-- Посуда на сушилке -->
  <g filter="url(#soft)">
    <path d="M316 292v-46c0-12 10-22 22-22h18c12 0 22 10 22 22v46Z" fill="url(#mug)"/>
    <ellipse cx="347" cy="246" rx="31" ry="9" fill="#f3a187"/>
    <path d="M378 258c18 0 18 24 0 24" fill="none" stroke="#bd5138" stroke-width="7"/>
    <path d="M330 206c-6-14 8-18 2-30M354 204c-6-14 8-18 2-30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <path d="M432 292c0-30 18-52 48-52s48 22 48 52Z" fill="#a8b89b"/>
    <ellipse cx="480" cy="292" rx="48" ry="10" fill="#c4d1b8"/>
  </g>

  <!-- Платформа -->
  <g filter="url(#soft)">
    <rect x="228" y="288" width="344" height="30" rx="15" fill="url(#wood)"/>
  </g>
  <rect x="240" y="294" width="320" height="5" rx="2.5" fill="#fffdf4" opacity=".7"/>
  <g stroke="#cfc2a8" stroke-width="2" opacity=".8">
    <path d="M262 306v6M290 306v6M318 306v6M346 306v6M374 306v6M402 306v6M430 306v6M458 306v6M486 306v6M514 306v6M542 306v6"/>
  </g>
  <rect x="230" y="268" width="14" height="30" rx="7" fill="#ebdfc7"/>
  <rect x="556" y="268" width="14" height="30" rx="7" fill="#ebdfc7"/>

  <!-- Передние ножки и перекладина -->
  <g stroke="#f4ecda" stroke-width="13" stroke-linecap="round" filter="url(#soft)">
    <path d="M302 320 268 468"/>
    <path d="M498 320 532 468"/>
  </g>
  <g stroke="#e6dac2" stroke-width="8" stroke-linecap="round">
    <path d="M284 412h232"/>
    <path d="M275 455c24-8 35-26 42-48M525 455c-24-8-35-26-42-48" fill="none"/>
  </g>
  <g fill="#ded2ba">
    <circle cx="268" cy="470" r="9"/>
    <circle cx="532" cy="470" r="9"/>
    <circle cx="330" cy="456" r="7"/>
    <circle cx="470" cy="456" r="7"/>
  </g>

  <!-- Полотенце -->
  <path d="M548 318c16 26 12 54 22 78 7 17 20 22 32 16l-8 24c-24 6-42-8-48-30-8-28-4-58-14-88Z" fill="#f8f0df" filter="url(#soft)"/>
  <path d="M551 334c10 24 8 48 16 68" fill="none" stroke="#e49477" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <!-- Трава -->
  <g stroke="#7e9576" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M126 554c-6-20-2-34 8-48M138 554c2-22 10-34 24-42M664 530c-6-18-2-30 8-42M678 532c2-18 10-28 20-34"/>
  </g>
</svg>
